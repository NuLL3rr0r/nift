name: Stage-1B identity native certification

on:
  push:
    branches: [main]
    paths:
      - 'src/ProjectInfo*'
      - 'src/Identity*'
      - 'src/FileSystem*'
      - 'tests/identity_*'
      - 'tests/run_identity_certification.py'
      - 'tests/build_identity_probes.py'
      - 'tests/sidecar_*contracts.py'
      - '.github/workflows/e3b-sidecar-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            runner: ubuntu-latest
          - id: macos
            runner: macos-latest
          - id: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: make diffutils mingw-w64-ucrt-x86_64-gcc
      - name: Check out the immutable E2 baseline
        uses: actions/checkout@v5
        with:
          ref: c5f449c31cf93bd0155cae0332d6c4ffdd2aa161
          path: .build/e2-source
      - name: Check out the immutable E3B baseline
        uses: actions/checkout@v5
        with:
          ref: 6775a0028db69b0eaf55343b3dc00079920529d4
          path: .build/e3b-source
      - name: Preflight native Windows inaccessible-path fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tests/identity_windows_acl.py
      - name: Build both candidates
        if: runner.os != 'Windows'
        run: make -j2 nift && make -C .build/e2-source -j2 nift && make -C .build/e3b-source -j2 nift
      - name: Build both candidates on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -j2 nift.exe && make -C .build/e2-source -j2 nift.exe && make -C .build/e3b-source -j2 nift.exe
      - name: Native sidecar contracts
        shell: pwsh
        env:
          NIFT_IDENTITY_MSYS2: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          if ($IsWindows) {
            $env:NIFT_IDENTITY_CXX = Join-Path $env:NIFT_IDENTITY_MSYS2 'ucrt64/bin/g++.exe'
            if (!(Test-Path $env:NIFT_IDENTITY_CXX)) { throw 'UCRT compiler missing' }
            $env:PATH = "$env:NIFT_IDENTITY_MSYS2\ucrt64\bin;$env:NIFT_IDENTITY_MSYS2\usr\bin;$env:PATH"
            $suffix = '.exe'
          } else { $suffix = '' }
          python tests/run_identity_certification.py --e3b "./.build/e3b-source/nift$suffix" --e2 "./.build/e2-source/nift$suffix"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sidecar-native-${{ matrix.id }}
          path: |
            .build/identity/*.json
            .build/identity/*.log
          if-no-files-found: error
          include-hidden-files: true

  crossover:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            runner: ubuntu-latest
          - id: macos
            runner: macos-latest
          - id: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: make diffutils mingw-w64-ucrt-x86_64-gcc
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: sidecar-native-*
          path: .build/sidecar-imports
      - name: Build candidate
        if: runner.os != 'Windows'
        run: make -j2 nift
      - name: Build candidate on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -j2 nift.exe
      - name: Check real cross-platform metadata exports
        shell: pwsh
        env:
          NIFT_IDENTITY_MSYS2: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          if ($IsWindows) {
            $env:NIFT_IDENTITY_CXX = Join-Path $env:NIFT_IDENTITY_MSYS2 'ucrt64/bin/g++.exe'
            if (!(Test-Path $env:NIFT_IDENTITY_CXX)) { throw 'UCRT compiler missing' }
            $env:PATH = "$env:NIFT_IDENTITY_MSYS2\ucrt64\bin;$env:NIFT_IDENTITY_MSYS2\usr\bin;$env:PATH"
            $suffix = '.exe'
          } else { $suffix = '' }
          python tests/sidecar_platform_contracts.py --nift "./nift$suffix" --imports .build/sidecar-imports --output .build/sidecar-crossover.json --export .build/sidecar-export.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sidecar-crossover-${{ matrix.id }}
          path: .build/sidecar-crossover.json
          if-no-files-found: error
          include-hidden-files: true
